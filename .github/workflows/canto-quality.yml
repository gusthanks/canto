name: canto-quality

on:
  push:
    branches: [main, development, "canto/**"]
  pull_request:
    branches: [main, development]

jobs:
  rustfmt:
    name: "Rustfmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # config.rs is generated by meson at build time; create an empty
      # placeholder so the crate parses for a format-only check.
      - name: Add empty config.rs
        run: echo > src/config.rs

      # spotify-api is committed, but it is generator output, not hand-written
      # code: swap in an empty stub so the format check skips it.
      - name: Create generated crate stub
        run: |
          mkdir -p generated/spotify-api/src
          printf '[package]\nname = "spotify-api"\nversion = "0.0.0"\nedition = "2021"\n' > generated/spotify-api/Cargo.toml
          echo > generated/spotify-api/src/lib.rs

      - name: Check formatting
        run: cargo fmt --all -- --check

  blueprint-lint:
    name: "Blueprint Lint"
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: dnf install -y blueprint-compiler gtk4-devel libadwaita-devel libxml2 python3

      - name: Run blueprint lint
        run: ./scripts/checks/lint-blueprints.sh

  shellcheck:
    name: "ShellCheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get -y update && sudo apt-get -y install shellcheck

      - name: Run shellcheck
        run: find "$GITHUB_WORKSPACE" -type f \( -name "*.sh" -o -path "*/scripts/hooks/*" \) -print0 | xargs -0 shellcheck

  check-icons:
    name: "Bundled Icons"
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: dnf install -y gtk4 libadwaita glib2-devel findutils

      - name: Check every referenced icon is bundled
        run: ./scripts/checks/check-icons.sh

  translations:
    name: "Translations"
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v7

      - name: Install gettext
        run: dnf install -y gettext

      - name: Check POTFILES, pot and po files are up to date
        run: ./scripts/checks/check-translations.sh
