name: canto-snapshots

# Test builds only by hand (Actions > Run workflow): the weekly one published
# a pre-release every Friday nobody asked for
on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  flatpak:
    name: "Flatpak ${{ matrix.variant.arch }}"
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # The GNOME SDK comes installed in the image's layers. Updating it moves
      # files across overlay layers, which fails ("Invalid cross-device link",
      # then flatpak-builder exits 139). Copying the installation first puts
      # it all in the container's own layer, where the update works.
      - name: Put the image's Flatpak installation on one layer
        run: |
          for dir in $(flatpak --installations); do
            df -h "$dir"
            cp -a "$dir" "$dir.copy"
            rm -rf "$dir"
            mv "$dir.copy" "$dir"
          done
          flatpak update --noninteractive --assumeyes

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: canto-${{ matrix.variant.arch }}.flatpak
          manifest-path: flatpak/io.github.gusthanks.Canto.snapshots.json
          # No build cache: one restored from an older build made flatpak-builder
          # fail to update the GNOME SDK ("Invalid cross-device link", then exit 139)
          cache: false
          restore-cache: false
          arch: ${{ matrix.variant.arch }}

  release:
    name: "Create Snapshot Release"
    needs: [flatpak]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -type f -name "*.flatpak" | while read file; do
            cp "$file" release-files/
          done
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "snapshot-${{ github.run_number }}"
          name: "Canto Snapshot Build #${{ github.run_number }}"
          body: |
            Automated snapshot build from ${{ github.ref_name }} branch

            ## Downloads
            - `canto-x86_64.flatpak` - x86_64 build
            - `canto-aarch64.flatpak` - ARM64 build (postmarketOS, PinePhone, etc.)
          generate_release_notes: true
          files: release-files/*.flatpak
          make_latest: false
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
