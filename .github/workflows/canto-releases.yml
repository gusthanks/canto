name: canto-releases

# A release only when a version is tagged (26.11, 26.12...): pushing to main
# just builds and checks, it doesn't publish anything
on:
  push:
    tags: ["[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flatpak:
    name: "Flatpak ${{ matrix.variant.arch }}"
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # The GNOME SDK comes installed in the image's layers. Updating it moves
      # files across overlay layers, which fails ("Invalid cross-device link",
      # then flatpak-builder exits 139). Copying the installation first puts
      # it all in the container's own layer, where the update works.
      - name: Put the image's Flatpak installation on one layer
        run: |
          for dir in $(flatpak --installations); do
            df -h "$dir"
            cp -a "$dir" "$dir.copy"
            rm -rf "$dir"
            mv "$dir.copy" "$dir"
          done
          flatpak update --noninteractive --assumeyes

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: canto-${{ matrix.variant.arch }}.flatpak
          manifest-path: flatpak/io.github.gusthanks.Canto.json
          # No build cache: one restored from an older build made flatpak-builder
          # fail to update the GNOME SDK ("Invalid cross-device link", then exit 139)
          cache: false
          restore-cache: false
          arch: ${{ matrix.variant.arch }}

  release:
    name: "Create Release"
    needs: [flatpak]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -type f -name "*.flatpak" | while read file; do
            cp "$file" release-files/
          done
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Canto ${{ github.ref_name }}"
          body: |
            ## Install Canto

            1. Download **`canto-x86_64.flatpak`** below (on ARM, such as a Raspberry Pi: `canto-aarch64.flatpak`).
            2. Double-click it: an app store that handles Flatpak (GNOME Software, KDE Discover and others) opens it. Click **Install**.
            3. Open **Canto** from your app menu.

            The first install also downloads the GNOME platform Canto runs on (about 1 GB on disk, shared with other Flatpak apps).

            Double-click does nothing (Ubuntu, Arch, Omarchy)? Set up Flatpak once from [flatpak.org/setup](https://flatpak.org/setup/), then run `flatpak install --user canto-x86_64.flatpak` in the folder where you saved it.

            ### Em português

            Baixe o **`canto-x86_64.flatpak`** abaixo e dê dois cliques: a loja de apps abre, é só clicar em **Instalar**. Se nada acontecer (Ubuntu, Arch, Omarchy), ative o Flatpak uma vez em [flatpak.org/setup](https://flatpak.org/setup/) e rode `flatpak install --user canto-x86_64.flatpak` na pasta do arquivo.

            Spotify playback needs a Spotify Premium account. Canto is unofficial and not affiliated with Spotify.
          generate_release_notes: true
          files: release-files/*.flatpak
          make_latest: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
