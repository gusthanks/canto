name: canto-releases

# A release only when a version is tagged (26.11, 26.12...): pushing to main
# just builds and checks, it doesn't publish anything
on:
  push:
    tags: ["[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flatpak:
    name: "Flatpak ${{ matrix.variant.arch }}"
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: canto-${{ matrix.variant.arch }}.flatpak
          manifest-path: flatpak/io.github.gusthanks.Canto.json
          cache-key: flatpak-builder-${{ matrix.variant.arch }}-${{ github.sha }}
          arch: ${{ matrix.variant.arch }}

  release:
    name: "Create Release"
    needs: [flatpak]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -type f -name "*.flatpak" | while read file; do
            cp "$file" release-files/
          done
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Canto ${{ github.ref_name }}"
          body: |
            Canto ${{ github.ref_name }}

            ## Downloads
            - `canto-x86_64.flatpak` - x86_64 build
            - `canto-aarch64.flatpak` - ARM64 build (postmarketOS, PinePhone, etc.)
          generate_release_notes: true
          files: release-files/*.flatpak
          make_latest: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
