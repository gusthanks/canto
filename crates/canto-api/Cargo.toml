[package]
name = "canto-api"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Canto's API layer for music providers."

[features]
# Allows CANTO_ACCEPT_INVALID_CERTS to disable certificate validation in debug
# builds. Off by default so release builds do not carry the capability.
insecure-tls = []

[dependencies]
canto-auth = { path = "../canto-auth" }
canto-config = { path = "../canto-config" }
spotify-api = { path = "../../generated/spotify-api" }

serde_json = "1.0.96"
thiserror = "2.0.20"
async-trait = "0.1"
log = "0.4.17"
httpdate = "1.0.3"
http = "1.3"

reqwest = { version = "0.13", features = ["gzip"] }
reqwest-middleware = "0.4"
md-5 = "0.10.6"
hex = "0.4.3"
url = "2.4.1"
glib = "0.22.10"
gdk-pixbuf = "0.22.0"
futures = "0.3.18"
uuid = { version = "1.18", features = ["v5"] }
prost = "0.14"

[dependencies.serde]
version = "1.0.136"
features = ["derive"]

[dependencies.gdk]
version = "0.11.5"
package = "gdk4"

[dependencies.tokio]
version = "1"
# `rt` covers `spawn_blocking`, which keeps image decoding off the
# caller's thread.
features = ["rt", "fs", "macros", "sync", "time"]

[dependencies.gettext-rs]
version = "0.8.0"
features = ["gettext-system"]

[dev-dependencies.tokio]
version = "1"
# `test-util` gives the scheduler tests a paused clock, so their ordering does
# not depend on real timing.
features = ["test-util"]
