[workspace]
members = ["crates/canto-auth", "crates/canto-api", "crates/canto-audio-engine", "crates/canto-config", "crates/canto-core", "generated/spotify-api"]
resolver = "2"

[package]
name = "canto"
version = "0.1.0"
edition = "2018"
license = "MIT"

[dependencies]
canto-api = { path = "crates/canto-api" }
canto-audio-engine = { path = "crates/canto-audio-engine" }
canto-auth = { path = "crates/canto-auth" }
canto-config = { path = "crates/canto-config" }
canto-core = { path = "crates/canto-core" }
gio = "0.22"
glib = "0.22.10"
futures = "0.3.18"
libc = "0.2"
serde_json = "1.0.96"
ref_filter_map = "1.0.1"
zbus = { version = "6.3", default-features = false, features = ["tokio"] }
int-enum = "1.2.0"
lazy_static = "1.4.0"
log = "0.4.17"
env_logger = "0.11"
percent-encoding = "2.2.0"
url = "2.4.1"
open = "5.3.0"
symphonia = { version = "0.5.5", default-features = false, features = ["flac", "mp3", "ogg", "vorbis"] }
reqwest = "0.12"


[dependencies.gtk]
version = "0.11.5"
package = "gtk4"
features = ["gnome_50", "blueprint"]

[dependencies.libadwaita]
version = "0.9.2"
features = ["v1_9"]

[dependencies.gdk]
version = "0.11.5"
package = "gdk4"

[dependencies.librespot]
version = "0.8.0"

default-features = false
features = ["alsa-backend", "pulseaudio-backend", "native-tls", "with-libmdns"]

[dependencies.tokio]
version = "1"
features = ["rt", "fs", "macros", "sync"]

[dependencies.gettext-rs]
version = "0.8.0"
features = ["gettext-system"]


